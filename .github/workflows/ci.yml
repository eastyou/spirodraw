name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test spirodraw generation
        run: |
          python -m spirodraw --curves 6 --seed 42 --title 万花尺描摹画册 -o examples/万花尺画册.html
          python -c "import pathlib; text = pathlib.Path('examples/万花尺画册.html').read_text(encoding='utf-8'); assert text.count('<article') == 6, text.count('<article'); assert text.count('<section class=') == 4, text.count('<section class='); assert 'A4 portrait' in text; assert '自制万花尺' in text; assert '定圆半径 R' in text; assert '闭合' in text; print('OK cards', text.count('<article'), 'pages', text.count('<section class='))"
